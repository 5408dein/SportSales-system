server:
  port: 8103

spring:
  application:
    name: order-service
  config:
    import: "optional:nacos:order-service.yaml"
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/sale_system?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: 881011
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      discovery:
        server-addr: 127.0.0.1:8848
        ip: 127.0.0.1
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.salesystem.order.entity
  configuration:
    map-underscore-to-camel-case: true
