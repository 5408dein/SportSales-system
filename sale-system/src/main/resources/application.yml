server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/sale_system?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: 881011
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Redis（redis.enabled=true 时启用；false 不连Redis也能正常运行）
  redis:
    enabled: false
    host: 127.0.0.1
    port: 6379
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 4
        min-idle: 2

  # 排除 Redis 自动配置（由自定义 RedisConfig 手动控制）
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.salesystem.entity
  configuration:
    map-underscore-to-camel-case: true

# 线程池
async:
  executor:
    core-pool-size: 5
    max-pool-size: 10
    queue-capacity: 100
    thread-name-prefix: salesystem-async-
